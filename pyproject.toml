[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "docsage"
dynamic = ["version"]
description = "Document question answering you can measure: hybrid retrieval, reranking, cited answers and an evaluation suite, for any OpenAI-compatible LLM endpoint."
readme = "README.md"
authors = [{ name = "Alqama Rao" }]
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "llm", "evaluation", "search", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pypdf[crypto]>=4.3.1",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4.0"]
rerank = ["fastembed>=0.4.0"]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
docsage = "docsage.cli:main"

[project.urls]
Repository = "https://github.com/raoalqama-dev/docsage"

[tool.hatch.version]
path = "src/docsage/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "PT",   # pytest style
    "RUF",  # ruff-specific
    "SIM",  # simplifications
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["docsage"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
